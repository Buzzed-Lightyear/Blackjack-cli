; Blackjack key bindings. Edit this file, or change them from the game's setup.
; Each action takes one or more keys, separated by commas.
; A key is a letter or symbol, or one of: Space, Tab, Up, Down, Left, Right,
; Home, End, PageUp, PageDown, Insert, Delete, F1-F12.
; Enter, Escape, Backspace and the digits are reserved for typing bets.
; Keys only need to be different from the others read at the same time.

[keys]
; your turn
hit = D
stand = S
double = A
split = W
; between hands
deal = Space
bet_down = Q
bet_up = E
side_bet_1 = T
side_bet_2 = G
fast_forward = F
next_shoe = R
cash_out = X
; when the dealer shows an ace (the deal key declines)
insurance = Z
; whenever the game is waiting for you
book = B
count = C
; while on autopilot (any other key stops it)
slower = Q
faster = E
